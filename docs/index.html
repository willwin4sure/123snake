    rankedId=g.id; moveN=g.moves||0; score=g.score||0;
    localStorage.setItem(KG,g.id);
    overEl.hidden=true;
    var dur=build(to2d(g.cells),true);
    hud(); refresh();
    setTimeout(function(){lock=false; refresh(); if(g.over) gameOver();},dur);
  }
  function newGame(){
    lock=true; overEl.hidden=true;
    clearBoard();
    localStorage.removeItem(KG);
    api('/api/new',{}).then(function(g){
      startFrom(g);
    }).catch(function(err){
      lock=false;
      localGame(/rate limited/.test(err.message)
        ?'Too many games from your network right now'
        :'Can\u2019t reach the server');
    });
  }
  function resumeOrNew(){
    var id=localStorage.getItem(KG);
    if(!id){newGame();return;}
    lock=true;
    api('/api/state?id='+id).then(function(st){
      if(st.over){localStorage.removeItem(KG);newGame();return;}
      st.id=id;
      startFrom(st);
    }).catch(function(err){
      if(/no such game/.test(err.message)){localStorage.removeItem(KG);newGame();}
      else{lock=false; localGame();}
    });
  }

  function hitCell(e){
    var rect=board.getBoundingClientRect();
    var x=e.clientX-rect.left, y=e.clientY-rect.top;
    var c=Math.round((x-pad-cell/2)/step), r=Math.round((y-pad-cell/2)/step);
    if(r<0||r>=N||c<0||c>=N) return null;
    if(Math.abs(x-(px(c)+cell/2))>cell*.42) return null;
    if(Math.abs(y-(px(r)+cell/2))>cell*.42) return null;
    return {r:r,c:c};
  }
  function inPath(t){return path.indexOf(t)>=0}
  function canExtend(t){
    if(!path.length) return false;
    var last=path[path.length-1];
    return t.v===path[0].v && !inPath(t) &&
      Math.abs(t.r-last.r)+Math.abs(t.c-last.c)===1;
  }

  board.addEventListener('pointerdown',function(e){
    if(lock||overEl.hidden===false) return;
    initAudio();
    if(e.pointerId!==undefined){try{board.setPointerCapture(e.pointerId);}catch(_){}}
    gesture={id:e.pointerId,added:false,downHead:false,deselect:false};
    var pos=hitCell(e);
    if(!pos){path=[];refresh();return;}
    var t=grid[pos.r][pos.c];
    if(!t){path=[];refresh();return;}
    if(path.length===1&&t===path[0]){gesture.deselect=true;}
    else if(path.length&&t===path[path.length-1]){gesture.downHead=true;}
    else if(canExtend(t)){path.push(t);sTick(path.length-1);}
    else if(path.length>=2&&t===path[path.length-2]){path.pop();sPop();}
    else{path=[t];sTick(0);}
    refresh();
    e.preventDefault();
  });
  board.addEventListener('pointermove',function(e){
    if(!gesture||e.pointerId!==gesture.id||lock) return;
    var pos=hitCell(e);
    if(!pos) return;
    var t=grid[pos.r][pos.c];
    if(!t) return;
    if(!path.length){path=[t];gesture.added=true;sTick(0);refresh();return;}
    if(t===path[path.length-1]) return;
    if(path.length>=2&&t===path[path.length-2]){path.pop();gesture.added=true;sPop();refresh();return;}
    if(canExtend(t)){path.push(t);gesture.added=true;sTick(path.length-1);refresh();}
  });
  function endGesture(e){
    if(!gesture||(e.pointerId!==undefined&&e.pointerId!==gesture.id)) return;
    var g=gesture; gesture=null;
    if(lock) return;
    if(g.deselect&&!g.added){path=[];sPop();}
    else if(path.length>=2&&(g.added||g.downHead)) commitPath();
    refresh();
  }
  board.addEventListener('pointerup',endGesture);
  board.addEventListener('pointercancel',function(){gesture=null;});
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){path=[];refresh();}
  });

  function resyncFrom(st){
    moveN=st.moves; score=st.score;
    build(to2d(st.cells)); hud(); refresh();
    if(st.over) gameOver();
  }
  function moveError(err){
    if(err.state&&err.state.moves!==undefined){
      lock=false; path=[];
      resyncFrom(err.state);
      return;
    }
    if(/no such game/.test(err.message)){
      lock=false; path=[]; refresh();
      shareFeedback('Session expired \u2014 dealing a new game');
      newGame();
      return;
    }
    api('/api/state?id='+rankedId).then(function(st){
      lock=false; path=[];
      resyncFrom(st);
    }).catch(function(){
      lock=false; path=[]; refresh();
      shareFeedback('Connection lost \u2014 move not made, try again');
    });
  }
  function commitPath(){
    if(!ranked){doMerge(null);return;}
    var idxs=path.map(function(t){return t.r*N+t.c});
    // optimistic: the merge itself is deterministic, only refill values
    // are server-known — animate now, fill refills when the reply lands
    doMerge(api('/api/move',{id:rankedId,path:idxs,n:moveN}));
  }

  function doMerge(serverP){
    lock=true; hud();
    var head=path[path.length-1];
    var sum=path[0].v*path.length;
    var others=path.slice(0,-1);
    others.forEach(function(o){
      grid[o.r][o.c]=null;
      o.el.classList.add('merge');
      o.el.style.transform='translate('+px(head.c)+'px,'+px(head.r)+'px)';
    });
    path=[];
    sMerge(sum);
    var cells=others.map(function(o){return [o.r,o.c]});
    setTimeout(function(){
      others.forEach(function(o){o.el.remove()});
      setV(head,sum);
      head.el.classList.add('pop');
      setTimeout(function(){head.el.classList.remove('pop')},260);
      score=score+sum; hud();
      floatScore(sum,head);
      var settle=function(server){
        if(server){score=server.score;moveN=server.moves;hud();}
        cells.forEach(function(rc,i){
          var v=server?server.cells[rc[0]*N+rc[1]]:rnd13();
          setTimeout(function(){makeTile(rc[0],rc[1],v,true)},60+i*35);
        });
        setTimeout(function(){
          lock=false; hud(); refresh();
          var over=server?server.over===1:!movesAvail(values());
          if(over) gameOver();
        },cells.length*35+300);
      };
      if(serverP){
        serverP.then(settle,function(err){moveError(err);});
      }else{
        settle(null);
      }
    },175);
  }
  function floatScore(n,t){
    var f=document.createElement('div');
    f.className='fl'; f.textContent='+'+n;
    f.style.transform='translate('+(px(t.c)+cell*.22)+'px,'+(px(t.r)-cell*.1)+'px)';
    board.appendChild(f);
    f.addEventListener('animationend',function(){f.remove()});
  }
  function gameOver(){
    finalEl.textContent='Final score: '+score;
    submitRow.hidden=!ranked||!rankedId;
    if(ranked&&rankedId){
      submitMsg.hidden=true;
      iniEl.value=localStorage.getItem(KI)||'';
    }else{
      submitMsg.textContent=offlineReason+' \u2014 press New game to retry ranked';
      submitMsg.hidden=false;
    }
    overEl.hidden=false;
    sOver();
  }

  function submitScore(){
    var name=(iniEl.value||'').replace(/[^\w .-]/g,'').replace(/\s+/g,' ').trim().slice(0,16);
    if(name.length<2){
      submitMsg.textContent='Name: 2–16 characters';
      submitMsg.hidden=false;
      return;
    }
    submitBtn.disabled=true;
    api('/api/finish',{id:rankedId,name:name}).then(function(r){
      localStorage.setItem(KI,name);
      localStorage.removeItem(KG);
      rankedId=null;
      submitRow.hidden=true;
      submitMsg.textContent='#'+r.daily_rank+' today';
      submitMsg.hidden=false;
      submitBtn.disabled=false;
      openLB('daily');
    }).catch(function(err){
      submitBtn.disabled=false;
      submitMsg.textContent=err.message;
      submitMsg.hidden=false;
    });
  }

  var curPeriod='daily';

  function renderVisits(){
    if(visits) document.getElementById('visitsfoot').textContent=
      visits.total+' visits \u00B7 '+visits.today_unique+(visits.today_unique===1?' visitor':' visitors')+' today \u00B7 ';
  }
  function openLB(period){
    curPeriod=period;
    lbEl.dataset.p=period;
    var tabs=lbEl.querySelectorAll('.lbtabs button');
    tabs.forEach(function(b){b.classList.toggle('on',b.dataset.p===period)});
    api('/api/board?p='+period).then(function(b){
      lbRows.textContent='';
      var mine=(localStorage.getItem(KI)||'').toLowerCase();
      if(!b.rows.length){
        var li=document.createElement('li');
        li.textContent='No scores yet \u2014 be first!';
        lbRows.appendChild(li);
      }
      b.rows.forEach(function(row,i){
        var li=document.createElement('li');
        var cls=[];
        if(i<3)cls.push('m'+(i+1));
        if(mine&&row.name.toLowerCase()===mine)cls.push('me');
        li.className=cls.join(' ');
        var l=document.createElement('span');
        var em=document.createElement('em');
        em.textContent=(i+1)+'.';
        l.appendChild(em);
        l.appendChild(document.createTextNode(row.name));
        if(mine&&row.name.toLowerCase()===mine){
          var tag=document.createElement('span');
          tag.className='metag';
          tag.textContent='you';
          l.appendChild(tag);
        }
        var r=document.createElement('span');
        r.textContent=row.score;
        li.appendChild(l);li.appendChild(r);
        lbRows.appendChild(li);
      });
      lbFoot.textContent='';
      renderVisits();
    }).catch(function(err){
      lbFoot.textContent=err.message;
    });
  }
  var AC=null, soundOn=localStorage.getItem(KS)!=='off';
  function setMuteLabel(){muteBtn.textContent='Sound: '+(soundOn?'on':'off')}
  setMuteLabel();
  function initAudio(){
    if(!soundOn) return;
    try{
      if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
      if(AC.state==='suspended') AC.resume();
    }catch(_){AC=null;}
  }
  function blip(f,dt,dur,type,g){
    if(!AC||!soundOn) return;
    try{
      if(AC.state==='suspended') AC.resume();
      var t0=AC.currentTime+(dt||0);
      var o=AC.createOscillator(), gn=AC.createGain();
      o.type=type||'sine'; o.frequency.value=f;
      gn.gain.setValueAtTime(0,t0);
      gn.gain.linearRampToValueAtTime(g||.09,t0+.012);
      gn.gain.exponentialRampToValueAtTime(.0005,t0+(dur||.08));
      o.connect(gn); gn.connect(AC.destination);
      o.start(t0); o.stop(t0+(dur||.08)+.02);
    }catch(_){}
  }
  var silentEl=null;
  function unlockAudio(){
    initAudio();
    if(AC){
      try{
        var b=AC.createBuffer(1,1,22050), src=AC.createBufferSource();
        src.buffer=b; src.connect(AC.destination); src.start(0);
      }catch(_){}
    }
    // iOS: a looping media element moves the audio session to "playback",
    // which ignores the silent switch; WebAudio alone stays mutable
    if(!silentEl){
      try{
        silentEl=new Audio('data:audio/wav;base64,UklGRrQBAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YZABAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA');
        silentEl.loop=true; silentEl.setAttribute('playsinline','');
        silentEl.play().catch(function(){silentEl=null;});
      }catch(_){silentEl=null;}
    }
    ['touchend','pointerdown','keydown'].forEach(function(t){
      document.removeEventListener(t,unlockAudio,true);
    });
  }
  ['touchend','pointerdown','keydown'].forEach(function(t){
    document.addEventListener(t,unlockAudio,true);
  });
  var PENTA=[0,2,4,7,9];
  function sTick(i){
    i=Math.min(i,14);
    blip(330*Math.pow(2,(PENTA[i%5]+12*Math.floor(i/5))/12),0,.07,'sine',.08);
  }
  function sPop(){blip(240,0,.06,'sine',.06)}
  function sMerge(sum){
    blip(392,0,.1,'sine',.09); blip(523,.06,.12,'sine',.09);
    if(sum>=12) blip(659,.12,.16,'triangle',.08);
    if(sum>=48) blip(784,.18,.2,'triangle',.08);
    if(sum>=192) blip(1047,.24,.22,'triangle',.08);
    if(sum>=768) blip(1319,.3,.26,'triangle',.08);
    if(sum>=3072) blip(1568,.36,.3,'triangle',.07);
    if(sum>=12288) blip(2093,.42,.34,'triangle',.07);
    if(sum>=49152) blip(2637,.48,.4,'triangle',.06);
  }
  function sOver(){blip(330,0,.14,'sine',.07);blip(262,.15,.14,'sine',.07);blip(196,.3,.24,'sine',.07)}

  var shareBtn=document.getElementById('share');
  var shareTip=document.getElementById('sharetip');
  var SHARE_URL='https://123snake.com/';
  var tipTimer=null;
  function shareFeedback(msg){
    shareTip.textContent=msg;
    shareTip.classList.add('show');
    clearTimeout(tipTimer);
    tipTimer=setTimeout(function(){shareTip.classList.remove('show');},1600);
  }
  function emojiTile(v){
    if(v<=3)return'⬜';
    if(v<16)return'\u{1F7E6}';
    if(v<64)return'\u{1F7E9}';
    if(v<256)return'\u{1F7E8}';
    if(v<1024)return'\u{1F7E7}';
    if(v<4096)return'\u{1F7E5}';
    if(v<16384)return'\u{1F7EA}';
    return'⬛';
  }
  function emojiBoard(){
    var rows=[];
    for(var r=0;r<N;r++){
      var line='';
      for(var c=0;c<N;c++) line+=emojiTile(grid[r][c]?grid[r][c].v:1);
      rows.push(line);
    }
    return rows.join('\n');
  }
  function copyChain(txt){
    var ta=document.createElement('textarea');
    ta.value=txt;
    ta.style.position='fixed';
    ta.style.left='-1000px';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    var ok=false;
    try{ok=document.execCommand('copy');}catch(_){}
    ta.remove();
    if(ok){
      shareFeedback('Copied!');
      return;
    }
    var settled=false;
    var fail=function(){
      if(settled) return;
      settled=true;
      finalEl.textContent=txt;
      shareFeedback('Copy the text above');
      shareTip.classList.add('show');
    };
    if(navigator.clipboard&&navigator.clipboard.writeText){
      setTimeout(fail,800);
      navigator.clipboard.writeText(txt).then(function(){
        if(!settled){settled=true;shareFeedback('Copied!');}
      },fail);
    }else{
      fail();
    }
  }
  shareBtn.addEventListener('click',function(){
    var txt='123 Snake \u2014 '+score+' points!\n'+emojiBoard()+'\nCan you beat it? Play: '+SHARE_URL;
    if(navigator.share&&/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)){
      navigator.share({text:txt}).catch(function(){copyChain(txt);});
    }else{
      copyChain(txt);
    }
  });
  muteBtn.addEventListener('click',function(){
    soundOn=!soundOn;
    localStorage.setItem(KS,soundOn?'on':'off');
    if(soundOn){initAudio();sTick(0);}
    setMuteLabel();
  });
  var lbEl=document.getElementById('lb'),
      lbRows=document.getElementById('lbrows'),
      lbFoot=document.getElementById('lbfoot'),
      submitRow=document.getElementById('submitrow'),
      submitMsg=document.getElementById('submitmsg'),
      submitBtn=document.getElementById('submitscore'),
      iniEl=document.getElementById('ini');
  lbEl.querySelectorAll('.lbtabs button').forEach(function(b){
    b.addEventListener('click',function(){openLB(b.dataset.p)});
  });
  submitBtn.addEventListener('click',submitScore);
  iniEl.addEventListener('keydown',function(e){if(e.key==='Enter')submitScore()});
  api('/api/hit',{}).then(function(h){
    visits=h;
    renderVisits();
  }).catch(function(){});
  setInterval(function(){if(!offline)openLB(curPeriod)},30000);
  document.getElementById('newgame').addEventListener('click',newGame);
  document.getElementById('again').addEventListener('click',newGame);
  window.addEventListener('resize',layout);

  window.__snake={
    values:values,
    score:function(){return score},
    tryPath:function(cells){
      path=[];
      for(var i=0;i<cells.length;i++){
        var t=grid[cells[i][0]][cells[i][1]];
        if(!t) return false;
        if(i===0) path=[t];
        else if(canExtend(t)) path.push(t);
        else {path=[];return false;}
      }
      refresh();
      return true;
    },
    release:function(){if(path.length>=2)commitPath();},
    locked:function(){return lock},
    forceOver:function(){gameOver()}
  };

  layout();
  resumeOrNew();
  openLB('daily');
})();
</script>
</body>
