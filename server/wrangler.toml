name = "snake-api"
main = "worker.js"
compatibility_date = "2026-08-01"
workers_dev = false

# API on the site's apex zone (already on Cloudflare DNS)
routes = [
  { pattern = "api.123snake.com", custom_domain = true },
]

# The game engine (same wasm the solver lab embeds).
rules = [
  { type = "CompiledWasm", globs = ["**/*.wasm"], fallthrough = false },
]

[[durable_objects.bindings]]
name = "GAME"
class_name = "GameSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameSession"]

# Created with: npx wrangler d1 create snake-scores
# then paste the database_id it prints below, and initialize with:
#   npx wrangler d1 execute snake-scores --remote --file schema.sql
[[d1_databases]]
binding = "DB"
database_name = "snake-scores"
database_id = "fc6f1a64-41c7-47a0-be6d-f06ee387c01f"
